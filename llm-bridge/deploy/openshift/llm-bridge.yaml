# Jembatan Ollama -> LLM internal (OpenAI-compatible).
# Ganti IMAGE_PLACEHOLDER dengan image hasil build, lalu sesuaikan endpoint/model.
apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: llm-bridge
      labels:
        app: llm-bridge
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: llm-bridge
      template:
        metadata:
          labels:
            app: llm-bridge
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: bridge
              image: IMAGE_PLACEHOLDER
              ports:
                - containerPort: 8080
                  name: http
              env:
                # Sesuaikan dengan gateway LLM internal perusahaan.
                - name: UPSTREAM_BASE_URL
                  value: https://llm.internal/v1
                - name: UPSTREAM_MODEL
                  value: qwen2.5-vl-7b
                - name: PUBLIC_MODEL
                  value: qwen2.5-vl-7b
                # Token hanya dari Secret; jangan ditulis di sini.
                - name: UPSTREAM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-bridge-auth
                      key: api-key
                      optional: true
                - name: UPSTREAM_TIMEOUT_MS
                  value: '240000'
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
                timeoutSeconds: 3
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 20
                timeoutSeconds: 3
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: llm-bridge
    spec:
      selector:
        app: llm-bridge
      ports:
        - name: http
          port: 8080
          targetPort: http
