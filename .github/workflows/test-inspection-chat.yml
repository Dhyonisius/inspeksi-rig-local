name: Test inspection chatbot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chatbot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF test dependencies
        run: python -m pip install -r deploy/container/requirements.txt
      - name: Syntax and regression tests
        env:
          PYTHON_EXE: python
        run: |
          node --check server.js
          node --check public/inspection-ai-ui.js
          node --test scripts/inspection-chat-context.test.js scripts/pdf-hub.test.js scripts/inspection-warnings.test.js scripts/vlm-learning.test.js
          node --test llm-bridge/test.js llm-bridge/dpop.test.js
